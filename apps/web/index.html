<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Atlas User Dashboard</title>
    <style>
      :root {
        --bg: #f3f5fb;
        --card: #fff;
        --ink: #0f172a;
        --muted: #475569;
        --line: #dbe1ea;
        --brand: #1d4ed8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top right, #dbeafe 0%, var(--bg) 40%);
        color: var(--ink);
        min-height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .wrap {
        width: 100vw;
        min-height: 100vh;
        padding: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.07);
        padding: 16px;
        margin-bottom: 14px;
      }
      h1, h2 { margin: 0 0 10px; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.05rem; }
      .muted { color: var(--muted); font-size: 0.92rem; }
      .grid { display: grid; gap: 12px; }
      .grid.two { grid-template-columns: 1fr 1fr; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      input, select, textarea, button {
        border: 1px solid #94a3b8;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.93rem;
        background: #fff;
        color: var(--ink);
      }
      input:focus, select:focus, textarea:focus {
        outline: 3px solid rgba(37, 99, 235, 0.18);
        outline-offset: 1px;
        border-color: #2563eb;
      }
      input:disabled, select:disabled, textarea:disabled {
        background: #e2e8f0;
        color: #64748b;
        cursor: not-allowed;
      }
      button {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: var(--ink);
        border-color: var(--line);
      }
      button:hover { filter: brightness(0.96); }
      button:active { transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(15,23,42,.14); }
      button:disabled { cursor: wait; opacity: .72; transform: none; }
      .hidden { display: none !important; }
      #app { min-height: calc(100vh - 24px); display: flex; flex-direction: column; gap: 12px; }
      .layout {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(420px, 48%) minmax(420px, 52%);
        gap: 12px;
      }
      .panel-col {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card.fill {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .scroll-card {
        min-height: 0;
        overflow: auto;
        flex: 1;
      }
      .status { display: inline-block; border-radius: 999px; background: #e0e7ff; padding: 4px 9px; font-size: 0.8rem; }
      .rss-list {
        min-height: 0;
        flex: 1;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        background: #f8fafc;
      }
      .rss-item { display: flex; gap: 8px; align-items: flex-start; padding: 4px 2px; font-size: 0.88rem; }
      .rss-item small { color: var(--muted); display: block; }
      .rss-actions { margin-left: auto; display: flex; gap: 6px; }
      .mini-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 8px;
        padding: 3px 8px;
        font-size: 0.78rem;
        cursor: pointer;
      }
      table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
      th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 10px 8px; vertical-align: top; }
      th { background: #f8fafc; }
      .title-cell {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .title-cell a { flex: 1; min-width: 0; }
      .browser-wrap {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .browser-toolbar {
        display: flex;
        gap: 8px;
        margin: 8px 0;
      }
      .browser-toolbar input {
        flex: 1;
      }
      iframe {
        width: 100%;
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .error-box {
        border: 1px solid #fecaca;
        background: #fef2f2;
        color: #7f1d1d;
        border-radius: 10px;
        padding: 8px 10px;
        max-height: 180px;
        overflow: auto;
      }
      .error-box-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
      }
      .error-box-close {
        width: 30px;
        height: 30px;
        min-width: 30px;
        padding: 0;
        border-radius: 8px;
        background: #fff;
        color: #7f1d1d;
        border-color: #fecaca;
      }
      .briefing {
        white-space: pre-wrap;
        line-height: 1.55;
        overflow: auto;
        max-height: 260px;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .nav-tabs { display: flex; gap: 6px; }
      .nav-tab { border: 1px solid transparent; background: transparent; color: var(--muted); }
      .nav-tab.active { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
      .view { display: none; }
      .view.active { display: block; }
      .dashboard-view.active {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 150px);
        min-height: 480px;
        overflow: hidden;
      }
      .source-row { cursor: pointer; }
      .source-row:hover td { background: #f8fafc; }
      .tag { display: inline-block; margin: 3px 4px 3px 0; padding: 3px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; font-size: 0.75rem; }
      .article-detail {
        flex: 1;
        width: 100%;
        min-width: 0;
        max-width: none;
        padding-top: 14px;
        text-align: left;
        line-height: 1.55;
      }
      .config-layout { display: grid; grid-template-columns: 280px minmax(320px, 1fr); gap: 12px; height: calc(100vh - 150px); }
      .config-sources, .config-editor { min-height: 0; overflow: auto; }
      .config-source { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; background: #fff; color: var(--ink); border: 1px solid var(--line); text-align: left; }
      .config-source.active { border-color: #93c5fd; background: #eff6ff; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .form-grid label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 0.85rem; }
      .form-grid input, .form-grid select, .form-grid textarea {
        width: 100%;
        border: 1px solid #94a3b8;
        background: #fff;
      }
      .form-grid textarea { min-height: 72px; resize: vertical; }
      .span-2 { grid-column: 1 / -1; }
      .dashboard-shell {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: var(--feed-width, 420px) 12px minmax(380px, 1fr);
        grid-template-areas: "feed resizer detail";
        gap: 10px;
      }
      .dashboard-shell > .feed-panel { grid-area: feed; }
      .dashboard-shell > .detail-resizer { grid-area: resizer; }
      .dashboard-shell > .detail-panel { grid-area: detail; }
      .feed-panel, .detail-panel {
        min-height: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .feed-list, .article-detail {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      .feed-card { width: 100%; display: block; text-align: left; margin-bottom: 8px; padding: 11px; color: var(--ink); background: #fff; border: 1px solid var(--line); }
      .feed-card.active { border-color: #93c5fd; background: #eff6ff; }
      .feed-card-title { display: block; font-weight: 750; line-height: 1.35; }
      .feed-card-meta { display: block; margin-top: 5px; color: var(--muted); font-size: 0.78rem; }
      .detail-toolbar {
        flex: 0 0 auto;
        min-height: 52px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }
      .detail-toolbar h2 { white-space: nowrap; }
      .detail-toolbar .toolbar { margin: 0; flex-wrap: nowrap; }
      .detail-toolbar select, .detail-toolbar button { height: 38px; padding: 8px 10px; white-space: nowrap; }
      .detail-resizer { width: 12px; cursor: col-resize; border-radius: 999px; background: linear-gradient(90deg, transparent 3px, #cbd5e1 3px, #cbd5e1 9px, transparent 9px); }
      .detail-resizer:hover, .detail-resizer.dragging { background: #93c5fd; }
      .article-detail.small { font-size: 0.88rem; }
      .detail-empty { color: var(--muted); padding: 24px 8px; }
      @media (max-width: 900px) {
        .grid.two { grid-template-columns: 1fr; }
        .layout { grid-template-columns: 1fr; overflow: visible; }
        body { overflow-y: auto; overflow-x: hidden; }
        .wrap { height: auto; min-height: 100vh; }
        #app { min-height: calc(100vh - 24px); height: auto; }
        .dashboard-view.active { height: auto; min-height: 0; overflow: visible; }
        .dashboard-shell { min-height: 480px; }
        .dashboard-shell {
          grid-template-columns: 1fr;
          grid-template-areas: "sources" "feed" "resizer" "detail";
          min-height: 0;
        }
        .detail-resizer { width: 100%; height: 12px; cursor: row-resize; }
        .card.fill { min-height: 320px; }
      }
      @media (max-width: 760px) {
        .wrap { padding: 8px; }
        th:nth-child(1), td:nth-child(1) { display: none; }
      }
      @media (max-width: 1100px) {
        .dashboard-shell {
          grid-template-columns: 210px minmax(250px, 360px) 12px minmax(320px, 1fr);
        }
      }
      .login-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 15%, rgba(147, 197, 253, 0.55), transparent 34%),
          radial-gradient(circle at 85% 80%, rgba(199, 210, 254, 0.55), transparent 32%),
          #f8fafc;
      }
      .login-screen.hidden { display: none; }
      .login-card {
        width: min(420px, calc(100vw - 32px));
        padding: 34px;
        border: 1px solid rgba(219, 225, 234, 0.95);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
      }
      .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
      .login-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--brand);
        color: #fff;
        font-size: 1.25rem;
        font-weight: 800;
      }
      .login-card h1 { margin: 0; }
      .login-form { display: grid; gap: 12px; margin-top: 18px; }
      .login-form label { display: grid; gap: 7px; color: var(--muted); font-size: 0.86rem; font-weight: 650; }
      .login-form input {
        width: 100%;
        height: 46px;
        background: #fff;
        border: 1px solid #94a3b8;
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .login-form button {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 46px;
        margin-top: 4px;
        background: #1d4ed8;
        color: #fff;
        border: 1px solid #1d4ed8;
        border-radius: 10px;
        font-weight: 700;
      }
      .login-form button:disabled { cursor: wait; opacity: 0.72; }
      .login-error { min-height: 20px; color: #b91c1c; font-size: 0.86rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="login-screen" id="loginCard" aria-label="Atlas login">
        <div class="login-card">
          <div class="login-brand">
            <div class="login-mark">A</div>
            <div>
              <h1>Atlas</h1>
              <div class="muted">Intelligence dashboard</div>
            </div>
          </div>
          <div class="muted">Sign in to access your sources and daily briefings.</div>
          <form class="login-form" id="loginForm">
            <label>API base URL
              <input id="apiBase" aria-label="API base URL" placeholder="https://localhost/api" />
            </label>
            <label>Username
              <input id="username" value="demo" autocomplete="username" aria-label="Username" />
            </label>
            <label>Password
              <input id="password" type="password" value="demo" autocomplete="current-password" aria-label="Password" />
            </label>
            <div id="loginError" class="login-error" role="alert"></div>
            <button id="loginBtn" type="submit">Sign in</button>
          </form>
        </div>
      </section>

      <div id="app" class="hidden">
        <div class="card topbar">
          <div>
            <h1>Atlas</h1>
            <div id="whoami" class="muted"></div>
          </div>
          <div class="nav-tabs">
            <button class="nav-tab active" type="button" data-view="dashboardView">Dashboard</button>
            <button class="nav-tab" type="button" data-view="configView">Configuration</button>
          </div>
        </div>

        <div id="dashboardView" class="view dashboard-view active">
          <div class="card" style="margin-bottom:10px;">
            <div class="toolbar">
              <select id="connector" aria-label="Connector"><option value="rss">RSS</option></select>
              <input id="limit" type="number" min="1" max="200" value="20" aria-label="Limit" />
              <button id="runBtn" title="Interroger les sources RSS maintenant">Actualiser les sources</button>
              <button class="secondary" id="refreshBtn" title="Afficher les items déjà enregistrés">Recharger le dernier run</button>
            </div>
            <div id="meta" class="muted" style="margin-top:8px;">Aucun run pour le moment.</div>
            <div id="briefingMeta" class="muted" style="margin-top:8px;">Aucun briefing pour aujourd'hui.</div>
            <div id="briefing" class="briefing hidden" style="margin-top:8px;"></div>
            <div id="errors" class="error-box hidden" style="margin-top:8px;"></div>
          </div>

          <div class="dashboard-shell">
            <div class="card feed-panel">
              <h2>Flux d’information</h2>
              <div id="feedList" class="feed-list"></div>
            </div>

            <div class="card detail-panel">
              <div class="detail-toolbar">
                <h2 style="margin:0;">Lecture</h2>
                <div class="toolbar">
                  <select id="textSize" aria-label="Taille du texte">
                    <option value="small">Petit</option>
                    <option value="normal" selected>Standard</option>
                    <option value="large">Grand</option>
                  </select>
                  <button class="secondary" id="openArticleBtn" type="button">Ouvrir sur le site</button>
                </div>
              </div>
              <div id="articleDetail" class="article-detail"><div class="detail-empty">Sélectionnez un article pour lire son texte et ses éléments enrichis.</div></div>
            </div>

            <div id="detailResizer" class="detail-resizer" title="Redimensionner le panneau"></div>
          </div>
        </div>

        <div id="configView" class="view">
          <div class="config-layout">
            <div class="card config-sources">
              <h2>Sources</h2>
              <div class="toolbar" style="margin-top:0;margin-bottom:10px;">
                <button class="secondary mini-btn" id="selectAllSourcesBtn" type="button">Tous</button>
                <button class="secondary mini-btn" id="selectNoneSourcesBtn" type="button">Aucun</button>
                <button class="secondary mini-btn" id="invertSourcesBtn" type="button">Inverse</button>
              </div>
              <div id="configSourceList"></div>
              <button id="addSourceBtn" type="button" style="width:100%;margin-top:8px;">+ Ajouter une source</button>
            </div>

            <div class="card config-editor">
              <h2>Paramètres de la source</h2>
              <div class="form-grid">
                <label>Nom<input id="sourceName" value="Nouvelle source" /></label>
                <label>Catégorie<select id="sourceCategory"><option>Presse</option><option>Think tank</option><option>Institution</option><option>Blog</option><option>X</option></select></label>
                <label class="span-2">URL du flux<input id="sourceUrl" placeholder="https://.../rss.xml" /></label>
                <label>Dernier fetch<input id="sourceLastFetch" value="Jamais testé" readonly /></label>
                <label>Résultat du test<input id="sourceTestResult" value="—" readonly /></label>
                <label>Fréquence<select id="sourceFrequency"><option value="60">Toutes les heures</option><option value="360">Toutes les 6 heures</option><option value="1440" selected>Une fois par jour</option></select></label>
                <label>Traitement<select id="sourceProcessing"><option>Résumé + tags</option><option>Résumé uniquement</option><option>Aucun traitement</option></select></label>
                <label class="span-2">Sujets à retenir<textarea id="sourceInclude" placeholder="géopolitique, OTAN, défense européenne"></textarea></label>
                <label class="span-2">Sujets à exclure<textarea id="sourceExclude" placeholder="sport, culture, faits divers"></textarea></label>
                <label>Prompt personnalisé<textarea id="sourcePrompt" placeholder="Consignes spécifiques à cette source..."></textarea></label>
                <label>Langue<select id="sourceLanguage"><option value="fr">Français</option><option value="en">Anglais</option><option value="auto">Détection automatique</option></select></label>
              </div>
              <div class="toolbar" style="justify-content:flex-end;margin-top:14px;">
                <button class="secondary" id="testSourceBtn" type="button">Tester la source</button>
                <button id="saveSourceBtn" type="button">Enregistrer</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let token = "";
      let sources = [];

      const apiBaseEl = document.getElementById("apiBase");
      const usernameEl = document.getElementById("username");
      const passwordEl = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");

      const appEl = document.getElementById("app");
      const whoamiEl = document.getElementById("whoami");
      const connectorEl = document.getElementById("connector");
      const limitEl = document.getElementById("limit");
      const runBtn = document.getElementById("runBtn");
      const refreshBtn = document.getElementById("refreshBtn");
      const metaEl = document.getElementById("meta");
      const errorsEl = document.getElementById("errors");

      const briefingEl = document.getElementById("briefing");

      const feedListEl = document.getElementById("feedList");
      const articleDetailEl = document.getElementById("articleDetail");
      const openArticleBtn = document.getElementById("openArticleBtn");
      const textSizeEl = document.getElementById("textSize");
      const detailResizerEl = document.getElementById("detailResizer");
      let selectedArticleUrl = "";
      let currentItems = [];

      function escapeHtml(s) {
        return String(s || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function getApiBase() {
        const typed = localStorage.getItem("atlas-api-base") || "";
        if (typed) return typed.replace(/\/$/, "");
        return `${window.location.origin}/api`;
      }

      function authHeaders() {
        return {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        };
      }

      function openArticle(url) {
        let finalUrl = String(url || "").trim();
        if (!finalUrl || finalUrl === "#") return;

        if (isFeedUrl(finalUrl)) {
          try {
            finalUrl = new URL(finalUrl, window.location.origin).origin;
          } catch {
            return;
          }
        }

        const anchor = document.createElement("a");
        anchor.href = finalUrl;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }

      async function login() {
        const base = getApiBase();
        const payload = {
          username: usernameEl.value.trim(),
          password: passwordEl.value
        };

        const res = await fetch(`${base}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const txt = await res.text();
          throw new Error(`Login failed: ${txt}`);
        }

        const data = await res.json();
        token = data.token;
        whoamiEl.innerHTML = `Connected as <span class="status">${escapeHtml(data.user.username)}</span> role <span class="status">${escapeHtml(data.user.role)}</span>`;

        document.getElementById("loginCard").classList.add("hidden");
        appEl.classList.remove("hidden");

        await loadSources();
        renderConfigSources();
        await refreshLatest();
        await refreshBriefing();
      }

      async function loadSources() {
        const base = getApiBase();
        const res = await fetch(`${base}/users/me/rss-sources`, { headers: authHeaders() });
        if (!res.ok) throw new Error(`Cannot load sources: HTTP ${res.status}`);
        const payload = await res.json();
        sources = payload.sources || [];
        renderConfigSources();
      }

      async function saveSources() {
        const base = getApiBase();
        const source_ids = getSelectedSourceIds();
        const res = await fetch(`${base}/users/me/rss-sources`, {
          method: "PUT",
          headers: authHeaders(),
          body: JSON.stringify({ source_ids })
        });
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(`Save failed: ${txt}`);
        }
        await loadSources();
      }

      async function runConnector() {
        const base = getApiBase();
        const connector = connectorEl.value;
        const limit = Number(limitEl.value || 20);
        runBtn.disabled = true;
        runBtn.textContent = "Running...";
        try {
          const res = await fetch(`${base}/connectors/${connector}/run?limit_per_feed=${limit}`, {
            method: "POST",
            headers: authHeaders(),
          });
          if (!res.ok) {
            const txt = await res.text();
            throw new Error(txt);
          }
          await refreshLatest();
          await refreshBriefing();
        } finally {
          runBtn.disabled = false;
          runBtn.textContent = "Run connector";
        }
      }

      async function refreshLatest() {
        const base = getApiBase();
        const connector = connectorEl.value;
        const limit = Number(limitEl.value || 20);
        const res = await fetch(`${base}/connectors/${connector}/latest?limit=${limit}`, {
          headers: authHeaders(),
        });

        if (!res.ok) {
          const txt = await res.text();
          metaEl.textContent = `Load failed: ${txt}`;
          return;
        }

        const payload = await res.json();
        render(payload);
      }

      async function refreshBriefing() {
        const base = getApiBase();
        const res = await fetch(`${base}/briefings/today`, { headers: authHeaders() });
        if (!res.ok) return;

        const payload = await res.json();
        briefingEl.textContent = payload.synthesis_markdown || "Aucun briefing disponible.";
        const existingMeta = document.getElementById("briefingMeta");
        if (existingMeta) {
          existingMeta.textContent = payload.updated_at
            ? `Mise à jour ${payload.updated_at} — ${payload.update_count || 1} génération(s) aujourd'hui`
            : "Aucun briefing pour aujourd'hui";
        }
      }

      function showArticle(item) {
        selectedArticleUrl = getExternalArticleUrl(item);
        const text = htmlToReadableText(item.content || item.description || item.cleaned_content || "");
        const summary = item.summary || "";
        const tags = Array.isArray(item.tags) ? item.tags : [];
        const actors = Array.isArray(item.actors) ? item.actors : [];

        articleDetailEl.innerHTML = `
          <h2>${escapeHtml(item.title || "Sans titre")}</h2>
          <div class="source-meta">${escapeHtml(item.source || "Source inconnue")} · ${escapeHtml(item.published_at || "Date inconnue")}</div>
          ${summary ? `<h3>Résumé</h3><p>${escapeHtml(summary)}</p>` : ""}
          ${tags.length ? `<div><strong>Tags</strong><br>${tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}
          ${actors.length ? `<div style="margin-top:8px;"><strong>Acteurs</strong><br>${actors.map(actor => `<span class="tag">${escapeHtml(actor)}</span>`).join("")}</div>` : ""}
          <h3>Contenu</h3>
          <div>${escapeHtml(text || "Le flux ne fournit pas de texte plus complet. Ouvrez la source originale pour lire l’article.")}</div>
          <div class="toolbar"><button class="mini-btn" type="button" id="detailOpenArticle">Ouvrir sur le site</button></div>
        `;
        document.getElementById("detailOpenArticle")?.addEventListener("click", () => openArticle(selectedArticleUrl));

        [...feedListEl.querySelectorAll(".feed-card")].forEach((card, index) => {
          card.classList.toggle("active", currentItems[index]?.url === selectedArticleUrl);
        });
      }

      function render(payload) {
        metaEl.innerHTML = `Connector <span class="status">${escapeHtml(payload.connector)}</span> | Mode <span class="status">${escapeHtml(payload.mode || "none")}</span> | Dernière exécution : ${escapeHtml(payload.run_at || "jamais")} | Items : ${escapeHtml(payload.count || 0)}`;

        const errors = payload.errors || [];
        if (errors.length) {
          errorsEl.classList.remove("hidden");
          errorsEl.innerHTML = `<div class="error-box-header"><strong>Erreurs des feeds (${errors.length})</strong><button type="button" class="error-box-close" aria-label="Fermer les erreurs" title="Fermer">×</button></div><ul style="margin:6px 0 0 18px;padding-right:6px;">${errors.map(error => `<li>${escapeHtml(error.feed)} : ${escapeHtml(error.error)} <button class="mini-btn error-open-btn" type="button" data-url="${escapeHtml(error.feed)}">Ouvrir</button></li>`).join("")}</ul>`;
          errorsEl.querySelector(".error-box-close")?.addEventListener("click", () => {
            errorsEl.classList.add("hidden");
          });
          errorsEl.querySelectorAll(".error-open-btn").forEach(button => {
            button.addEventListener("click", () => openArticle(button.dataset.url));
          });
        } else {
          errorsEl.classList.add("hidden");
          errorsEl.innerHTML = "";
        }

        currentItems = [...(payload.items || [])].filter(item =>
          String(item.title || "").trim().toLowerCase() !== "feed currently unavailable - open source url"
        ).sort((left, right) => {
          const leftRaw = String(left.published_at || "").trim();
          const rightRaw = String(right.published_at || "").trim();
          const leftTime = leftRaw ? Date.parse(leftRaw) : NaN;
          const rightTime = rightRaw ? Date.parse(rightRaw) : NaN;
          const leftRank = Number.isFinite(leftTime) ? 1 : 0;
          const rightRank = Number.isFinite(rightTime) ? 1 : 0;
          if (leftRank !== rightRank) return rightRank - leftRank;
          if (leftRank === 0) return 0;
          return rightTime - leftTime;
        });
        if (!currentItems.length) {
          feedListEl.innerHTML = '<div class="detail-empty"><strong>Aucun article disponible.</strong><br><br>Cliquez sur « Actualiser les sources » pour lancer une collecte, ou vérifiez les erreurs des feeds ci-dessus.</div>';
          articleDetailEl.innerHTML = '<div class="detail-empty">Sélectionnez un article pour lire son contenu.</div>';
          return;
        }

        feedListEl.innerHTML = currentItems.map((item, index) => `
          <button class="feed-card" type="button" data-index="${index}">
            <span class="feed-card-title">${escapeHtml(item.title || "Sans titre")}</span>
            <span class="feed-card-meta">${escapeHtml(item.source || "Source inconnue")} · ${escapeHtml(item.published_at || "Date inconnue")}</span>
          </button>
        `).join("");

        feedListEl.querySelectorAll(".feed-card").forEach(card => {
          card.addEventListener("click", () => showArticle(currentItems[Number(card.dataset.index)]));
        });

        showArticle(currentItems[0]);
      }

      function renderConfigSources() {
        const list = document.getElementById("configSourceList");
        if (!list) return;
        list.innerHTML = sources.map((source, index) => `
          <div class="config-source ${index === 0 ? "active" : ""}" data-source-id="${source.id}">
            <label style="display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer;">
              <input type="checkbox" class="config-source-enabled" data-source-id="${source.id}" ${source.enabled ? "checked" : ""} />
              <span><strong>${escapeHtml(source.name)}</strong><small class="muted">${escapeHtml(source.category)}</small><small>Dernier fetch : ${escapeHtml(source.last_fetch_at || "Jamais fetché")}</small></span>
            </label>
            <button class="mini-btn config-source-select" type="button" data-source-id="${source.id}">Éditer</button>
          </div>
        `).join("");

        list.querySelectorAll(".config-source-select").forEach(button => {
          button.addEventListener("click", () => {
            list.querySelectorAll(".config-source").forEach(item => item.classList.remove("active"));
            const row = button.closest(".config-source");
            row?.classList.add("active");
            const source = sources.find(item => String(item.id) === button.dataset.sourceId);
            if (!source) return;
            document.getElementById("sourceName").value = source.name || "";
            document.getElementById("sourceUrl").value = source.url || "";
            document.getElementById("sourceCategory").value = source.category || "Presse";
          });
        });

        list.querySelectorAll(".config-source-enabled").forEach(input => {
          input.addEventListener("change", () => {
            const source = sources.find(item => String(item.id) === input.dataset.sourceId);
            if (source) source.enabled = input.checked;
          });
        });

        if (sources[0]) {
          document.getElementById("sourceName").value = sources[0].name || "";
          document.getElementById("sourceUrl").value = sources[0].url || "";
        }
      }

      document.querySelectorAll(".nav-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".nav-tab").forEach(item => item.classList.remove("active"));
          document.querySelectorAll(".view").forEach(view => view.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById(tab.dataset.view)?.classList.add("active");
        });
      });

      openArticleBtn?.addEventListener("click", () => openArticle(selectedArticleUrl));

      textSizeEl?.addEventListener("change", () => {
        articleDetailEl.classList.remove("small", "large");
        if (textSizeEl.value !== "normal") articleDetailEl.classList.add(textSizeEl.value);
        localStorage.setItem("atlas-text-size", textSizeEl.value);
      });

      const savedTextSize = localStorage.getItem("atlas-text-size");
      if (savedTextSize) {
        textSizeEl.value = savedTextSize;
        articleDetailEl.classList.toggle("small", savedTextSize === "small");
        articleDetailEl.classList.toggle("large", savedTextSize === "large");
      }

      detailResizerEl?.addEventListener("pointerdown", event => {
        event.preventDefault();
        detailResizerEl.classList.add("dragging");
        const shell = detailResizerEl.closest(".dashboard-shell");
        const startX = event.clientX;
        const startWidth = shell.querySelector(".feed-panel").getBoundingClientRect().width;

        const move = moveEvent => {
          const width = Math.max(280, Math.min(520, startWidth + (moveEvent.clientX - startX)));
          document.documentElement.style.setProperty("--feed-width", `${width}px`);
        };
        const stop = () => {
          detailResizerEl.classList.remove("dragging");
          document.removeEventListener("pointermove", move);
          document.removeEventListener("pointerup", stop);
          localStorage.setItem("atlas-feed-width", getComputedStyle(document.documentElement).getPropertyValue("--feed-width").trim());
        };
        document.addEventListener("pointermove", move);
        document.addEventListener("pointerup", stop);
      });

      const savedFeedWidth = localStorage.getItem("atlas-feed-width");
      if (savedFeedWidth) document.documentElement.style.setProperty("--feed-width", savedFeedWidth);

      document.getElementById("loginForm")?.addEventListener("submit", async event => {
        event.preventDefault();
        const button = document.getElementById("loginBtn");
        const errorEl = document.getElementById("loginError");
        button.disabled = true;
        button.textContent = "Connexion...";
        errorEl.textContent = "";
        try {
          await login();
        } catch (error) {
          errorEl.textContent = error instanceof Error ? error.message : "Erreur de connexion";
        } finally {
          button.disabled = false;
          button.textContent = "Sign in";
        }
      });

      runBtn?.addEventListener("click", async () => {
        runBtn.disabled = true;
        runBtn.textContent = "Collecte en cours...";
        try {
          await runConnector();
          runBtn.textContent = "Actualisation terminée";
        } catch (error) {
          runBtn.textContent = "Échec de la collecte";
          metaEl.textContent = error instanceof Error ? error.message : "Erreur de collecte";
        } finally {
          setTimeout(() => {
            runBtn.disabled = false;
            runBtn.textContent = "Actualiser les feeds";
          }, 900);
        }
      });

      refreshBtn?.addEventListener("click", async () => {
        refreshBtn.disabled = true;
        refreshBtn.textContent = "Lecture du dernier run...";
        try {
          await refreshLatest();
          refreshBtn.textContent = "Dernier run affiché";
        } catch (error) {
          refreshBtn.textContent = "Erreur";
          metaEl.textContent = error instanceof Error ? error.message : "Impossible de relire le dernier run";
        } finally {
          setTimeout(() => {
            refreshBtn.disabled = false;
            refreshBtn.textContent = "Recharger le dernier run";
          }, 900);
        }
      });

      document.getElementById("selectAllSourcesBtn")?.addEventListener("click", () => {
        document.querySelectorAll(".config-source-enabled").forEach(input => {
          input.checked = true;
          const source = sources.find(item => String(item.id) === input.dataset.sourceId);
          if (source) source.enabled = true;
        });
      });

      document.getElementById("selectNoneSourcesBtn")?.addEventListener("click", () => {
        document.querySelectorAll(".config-source-enabled").forEach(input => {
          input.checked = false;
          const source = sources.find(item => String(item.id) === input.dataset.sourceId);
          if (source) source.enabled = false;
        });
      });

      document.getElementById("invertSourcesBtn")?.addEventListener("click", () => {
        document.querySelectorAll(".config-source-enabled").forEach(input => {
          input.checked = !input.checked;
          const source = sources.find(item => String(item.id) === input.dataset.sourceId);
          if (source) source.enabled = input.checked;
        });
      });

      document.getElementById("saveSourceBtn")?.addEventListener("click", async () => {
        const button = document.getElementById("saveSourceBtn");
        const sourceIds = [...document.querySelectorAll(".config-source-enabled:checked")]
          .map(input => Number(input.dataset.sourceId));
        button.disabled = true;
        button.textContent = "Enregistrement...";
        try {
          const base = getApiBase();
          const res = await fetch(`${base}/users/me/rss-sources`, {
            method: "PUT",
            headers: authHeaders(),
            body: JSON.stringify({ source_ids: sourceIds }),
          });
          if (!res.ok) throw new Error(await res.text());
          await loadSources();
          button.textContent = "Enregistré";
        } catch (error) {
          button.textContent = "Erreur";
        } finally {
          setTimeout(() => {
            button.disabled = false;
            button.textContent = "Enregistrer";
          }, 900);
        }
      });

      document.getElementById("testSourceBtn")?.addEventListener("click", async () => {
        const button = document.getElementById("testSourceBtn");
        const urlInput = document.getElementById("sourceUrl");
        const lastFetch = document.getElementById("sourceLastFetch");
        const testResult = document.getElementById("sourceTestResult");
        const url = urlInput.value.trim();

        if (!url) {
          testResult.value = "URL requise";
          urlInput.focus();
          return;
        }

        button.disabled = true;
        button.textContent = "Test en cours...";
        testResult.value = "Connexion...";

        try {
          const base = getApiBase();
          const res = await fetch(`${base}/sources/test-rss`, {
            method: "POST",
            headers: authHeaders(),
            body: JSON.stringify({ url, limit: 3 }),
          });
          const payload = await res.json();
          if (!res.ok) throw new Error(payload.detail || "Test impossible");

          testResult.value = payload.count ? `${payload.count} article(s) trouvé(s)` : "Aucun article trouvé";
          lastFetch.value = new Date().toLocaleString("fr-FR");
        } catch (error) {
          testResult.value = error instanceof Error ? error.message : "Échec du test";
          lastFetch.value = new Date().toLocaleString("fr-FR");
        } finally {
          button.disabled = false;
          button.textContent = "Tester la source";
        }
      });

      function htmlToReadableText(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";

        const template = document.createElement("template");
        template.innerHTML = raw;
        template.content.querySelectorAll("script,style,svg,noscript").forEach(node => node.remove());

        template.content.querySelectorAll("br").forEach(node => node.replaceWith("\n"));
        template.content.querySelectorAll("p,div,li,h1,h2,h3,h4,blockquote").forEach(node => {
          node.append("\n");
        });

        const text = template.content.textContent || "";
        return text
          .replace(/\r/g, "")
          .replace(/[ \t]+\n/g, "\n")
          .replace(/\n{3,}/g, "\n\n")
          .replace(/[ \t]{2,}/g, " ")
          .trim();
      }

      function getExternalArticleUrl(item) {
        const articleUrl = String(item?.url || "").trim();
        const sourceUrl = String(item?.source_url || "").trim();

        if (articleUrl && articleUrl !== "#" && !isFeedUrl(articleUrl)) {
          return articleUrl;
        }

        if (sourceUrl && sourceUrl !== "#" && !isFeedUrl(sourceUrl)) {
          return sourceUrl;
        }

        try {
          const base = articleUrl || sourceUrl;
          return base ? new URL(base, window.location.origin).origin : "";
        } catch {
          return "";
        }
      }

      function isFeedUrl(url) {
        try {
          const parsed = new URL(String(url || ""), window.location.origin);
          const path = parsed.pathname.toLowerCase();
          const query = parsed.search.toLowerCase();
          return path.endsWith(".atom") || path.endsWith(".rss") || path.endsWith(".xml") ||
            /\/feed\/?$/.test(path) || /\/rss\/?$/.test(path) || /\/atom\/?$/.test(path) ||
            /(?:^|&)(format|feed)=?(atom|rss|xml)/.test(query);
        } catch {
          return false;
        }
      }
    </script>
  </body>
</html>
