services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: atlas-api
    env_file:
      - ../../.env.example
    environment:
      RUN_MODE: ${RUN_MODE:-dryrun}
      ALLOW_OUTBOUND_NETWORK: ${ALLOW_OUTBOUND_NETWORK_API:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_local_dev}@postgres:5432/${POSTGRES_DB:-atlas}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: atlas-worker
    env_file:
      - ../../.env.example
    environment:
      RUN_MODE: ${RUN_MODE:-dryrun}
      ALLOW_OUTBOUND_NETWORK: ${ALLOW_OUTBOUND_NETWORK:-false}
      DRYRUN_DATASET_PATH: ${DRYRUN_DATASET_PATH:-./tests/fixtures/dryrun}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_local_dev}@postgres:5432/${POSTGRES_DB:-atlas}
      REDIS_URL: redis://redis:6379/0
    command: ["python3", "apps/worker/worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: atlas-scheduler
    env_file:
      - ../../.env.example
    environment:
      RUN_MODE: ${RUN_MODE:-dryrun}
      ALLOW_OUTBOUND_NETWORK: ${ALLOW_OUTBOUND_NETWORK:-false}
      DRYRUN_DATASET_PATH: ${DRYRUN_DATASET_PATH:-./tests/fixtures/dryrun}
      SCHEDULER_LOOP_SEC: ${SCHEDULER_LOOP_SEC:-60}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_local_dev}@postgres:5432/${POSTGRES_DB:-atlas}
      REDIS_URL: redis://redis:6379/0
    command: ["python3", "apps/worker/scheduler.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: atlas-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: atlas-reverse-proxy
    profiles: ["https"]
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: atlas-opensearch
    profiles: ["search"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"

volumes:
  postgres_data:
  opensearch_data:
  caddy_data:
  caddy_config:
